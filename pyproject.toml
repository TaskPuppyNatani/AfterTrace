[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aftertrace"
version = "0.1.0.dev0"
description = "Local-first coding-agent workflow intelligence."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TaskPuppy Kreations" }
]
dependencies = [
    "platformdirs>=4.3",
    "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.8",
]

[project.scripts]
aftertrace = "aftertrace.cli.main:main"

[project.gui-scripts]
aftertrace-gui = "aftertrace.ui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
